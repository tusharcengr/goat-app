<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ছাগল পালন অ্যাপ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen p-6">

<div class="max-w-lg mx-auto bg-white rounded-3xl shadow-2xl p-8 mt-10">
  <div id="dash">
    <h1 class="text-4xl font-bold text-center text-green-700 mb-8">ছাগল পালন</h1>
    <button onclick="show('form')" class="w-full bg-green-600 text-white py-5 rounded-2xl text-2xl font-bold mb-8">
      নতুন ছাগল যোগ করুন
    </button>

    <div class="grid grid-cols-3 gap-6 text-center">
      <div class="bg-blue-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="total">0</p><p class="text-xl">মোট</p></div>
      <div class="bg-pink-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="female">0</p><p class="text-xl">মাদি</p></div>
      <div class="bg-indigo-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="male">0</p><p class="text-xl">পুরুষ</p></div>
      <div class="bg-purple-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="pregnant">0</p><p class="text-xl">গর্ভবতী</p></div>
      <div class="bg-yellow-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="patha">0</p><p class="text-xl">পাঠা</p></div>
      <div class="bg-gray-300 p-6 rounded-2xl"><p class="text-5xl font-bold" id="khashi">0</p><p class="text-xl">খাসি</p></div>
    </div>
  </div>

  <div id="form" class="hidden">
    <button onclick="show('dash')" class="mb-6 text-blue-600 font-bold text-xl">← ড্যাশবোর্ড</button>
    <h2 class="text-3xl font-bold text-center mb-8">নতুন ছাগলের তথ্য</h2>
    
    <form id="f" class="space-y-6">
      <input type="text" id="name" placeholder="নাম/আইডি" required class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
      <input type="text" id="breed" placeholder="জাত" class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
      <select id="gender" onchange="toggleStatus()" required class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
        <option value="">লিঙ্গ বাছুন</option>
        <option value="male">পুরুষ</option>
        <option value="female">মাদি</option>
      </select>
      <div id="statusDiv" class="hidden">
        <select id="status" class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
          <option value="">স্ট্যাটাস</option>
        </select>
      </div>
      <input type="date" id="dob" class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
      <input type="text" id="shed" placeholder="শেড" class="w-full p-4 border-2 border-gray-300 rounded-xl text-xl">
      <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white py-5 rounded-2xl text-2xl font-bold">
        সেভ করুন
      </button>
    </form>
  </div>
</div>

<script>
// তোমার সর্বশেষ Deploy করা লিঙ্ক এখানে বসাও
const URL = "https://script.google.com/macros/s/AKfycbzc2JSEapr0eU437MYEVkqDs2DBfax9gwDAcfA5lAeQ8yqn3AGe7KIcQptQzPNoK12dXg/exec";

function show(x) {
  document.getElementById('dash').classList.toggle('hidden', x !== 'dash');
  document.getElementById('form').classList.toggle('hidden', x !== 'form');
  if (x === 'dash') load();
}

function toggleStatus() {
  const g = document.getElementById('gender').value;
  const d = document.getElementById('statusDiv');
  const s = document.getElementById('status');
  if (g === 'male') { d.classList.remove('hidden'); s.innerHTML = '<option value="patha">পাঠা</option><option value="khashi">খাসি</option>'; }
  else if (g === 'female') { d.classList.remove('hidden'); s.innerHTML = '<option value="chagi">ছাগী</option><option value="pregnant">গর্ভবতী</option>'; }
  else d.classList.add('hidden');
}

async function load() {
  try {
    const r = await fetch(URL + "?action=getGoats");
    const goats = await r.json();
    document.getElementById('total').textContent = goats.length;
    document.getElementById('male').textContent = goats.filter(x=>x.gender==='male').length;
    document.getElementById('female').textContent = goats.filter(x=>x.gender==='female').length;
    document.getElementById('pregnant').textContent = goats.filter(x=>x.status==='pregnant').length;
    document.getElementById('patha').textContent = goats.filter(x=>x.status==='patha').length;
    document.getElementById('khashi').textContent = goats.filter(x=>x.status==='khashi').length;
  } catch(e) {}
}

document.getElementById('f').onsubmit = async function(e) {
  e.preventDefault();
  const goat = {
    id: Date.now().toString(),
    name: document.getElementById('name').value.trim(),
    breed: document.getElementById('breed').value,
    gender: document.getElementById('gender').value,
    status: document.getElementById('status').value || "",
    dob: document.getElementById('dob').value,
    shed: document.getElementById('shed').value
  };
  await fetch(URL + "?action=saveGoat&data=" + encodeURIComponent(JSON.stringify(goat)));
  alert("সফল! শিটে ডাটা গিয়েছে");
  this.reset();
  document.getElementById('statusDiv').classList.add('hidden');
  show('dash');
};

load();
</script>
</body>
</html>
