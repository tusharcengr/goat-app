<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ছাগল পালন</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-green-50 min-h-screen p-4">

<div class="max-w-lg mx-auto bg-white rounded-3xl shadow-xl p-8 mt-10">

  <div id="dash">
    <h1 class="text-4xl font-bold text-center text-green-700 mb-8">ছাগল পালন</h1>
    <button onclick="show('form')" class="w-full bg-green-600 text-white py-5 rounded-2xl text-2xl font-bold">নতুন ছাগল যোগ করুন</button>
    
    <div class="grid grid-cols-3 gap-4 mt-8 text-center">
      <div class="bg-blue-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="total">0</p><p>মোট</p></div>
      <div class="bg-pink-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="female">0</p><p>মাদি</p></div>
      <div class="bg-indigo-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="male">0</p><p>পুরুষ</p></div>
      <div class="bg-purple-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="pregnant">0</p><p>গর্ভবতী</p></div>
      <div class="bg-yellow-100 p-6 rounded-2xl"><p class="text-5xl font-bold" id="patha">0</p><p>পাঠা</p></div>
      <div class="bg-gray-300 p-6 rounded-2xl"><p class="text-5xl font-bold" id="khashi">0</p><p>খাসি</p></div>
    </div>
  </div>

  <div id="form" class="hidden mt-8">
    <button onclick="show('dash')" class="mb-6 text-blue-600 font-bold text-xl">← ড্যাশবোর্ড</button>
    <h2 class="text-3xl font-bold text-center mb-6">নতুন ছাগল</h2>
    
    <form id="f" class="space-y-5">
      <input type="text" id="name" placeholder="নাম/আইডি" required class="w-full p-4 border-2 rounded-xl text-xl">
      <input type="text" id="breed" placeholder="জাত" class="w-full p-4 border-2 rounded-xl text-xl">
      <select id="gender" onchange="toggleStatus()" required class="w-full p-4 border-2 rounded-xl text-xl">
        <option value="">লিঙ্গ</option>
        <option value="male">পুরুষ</option>
        <option value="female">মাদি</option>
      </select>
      <div id="statusDiv" class="hidden">
        <select id="status" class="w-full p-4 border-2 rounded-xl text-xl">
          <option value="">স্ট্যাটাস</option>
        </select>
      </div>
      <input type="date" id="dob" class="w-full p-4 border-2 rounded-xl text-xl">
      <input type="text" id="shed" placeholder="শেড" class="w-full p-4 border-2 rounded-xl text-xl">
      <button type="submit" class="w-full bg-green-600 text-white py-5 rounded-2xl text-2xl font-bold">সেভ করুন</button>
    </form>
  </div>

</div>

<script>
// এখানে নতুন Deploy করা লিঙ্ক বসাও (যেটা এইমাত্র পেয়েছো)
const URL = "https://script.google.com/macros/s/AKfycbynBsQ8zMzTPsHbWz9e4sP_5LUEUeW6g_896I25Xcwdhds05R4_RuFUHNHgz2eo42NqfA/exec";

function show(x) {
  document.getElementById('dash').classList.add('hidden');
  document.getElementById('form').classList.add('hidden');
  document.getElementById(x).classList.remove('hidden');
  if (x === 'dash') load();
}

function toggleStatus() {
  const g = document.getElementById('gender').value;
  const d = document.getElementById('statusDiv');
  const s = document.getElementById('status');
  if (g === 'male') { d.classList.remove('hidden'); s.innerHTML = '<option value="patha">পাঠা</option><option value="khashi">খাসি</option>'; }
  else if (g === 'female') { d.classList.remove('hidden'); s.innerHTML = '<option value="chagi">ছাগী</option><option value="pregnant">গর্ভবতী</option>'; }
  else d.classList.add('hidden');
}

async function load() {
  const r = await fetch(URL + "?action=getGoats");
  const goats = await r.json();
  document.getElementById('total').textContent = goats.length;
  document.getElementById('male').textContent = goats.filter(x=>x.gender==='male').length;
  document.getElementById('female').textContent = goats.filter(x=>x.gender==='female').length;
  document.getElementById('pregnant').textContent = goats.filter(x=>x.status==='pregnant').length;
  document.getElementById('patha').textContent = goats.filter(x=>x.status==='patha').length;
  document.getElementById('khashi').textContent = goats.filter(x=>x.status==='khashi').length;
}

document.getElementById('f').onsubmit = async function(e) {
  e.preventDefault();
  const goat = {
    id: Date.now().toString(),
    name: document.getElementById('name').value,
    breed: document.getElementById('breed').value,
    gender: document.getElementById('gender').value,
    status: document.getElementById('status').value || "",
    dob: document.getElementById('dob').value,
    shed: document.getElementById('shed').value
  };
  await fetch(URL + "?action=saveGoat&data=" + encodeURIComponent(JSON.stringify(goat)));
  alert("সফল! ডাটা শিটে চলে গেছে");
  this.reset();
  document.getElementById('statusDiv').classList.add('hidden');
  show('dash');
};

// 🌟 সংশোধন: পেজ লোডের সময় ড্যাশবোর্ড দেখান এবং ডেটা লোড করুন
show('dash');
</script>
</body>
</html>
